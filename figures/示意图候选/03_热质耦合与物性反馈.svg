<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" fill="#18324b">
  <defs>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#49657d"/></marker>
    <marker id="hot" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#df6e32"/></marker>
    <marker id="wet" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#2d86bd"/></marker>
    <marker id="white" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#ffffff"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#18324b" flood-opacity="0.12"/></filter>
    <style>text{font-family:'SimHei','Microsoft YaHei','Noto Sans CJK SC',sans-serif}.title{font-size:50px;font-weight:700}.h{font-size:34px;font-weight:700}.b{font-size:30px}.s{font-size:26px;fill:#617487}.math{font-family:'Times New Roman','SimHei',serif;font-size:30px}.flow{fill:none;stroke:#49657d;stroke-width:4;marker-end:url(#arr)}</style>
  </defs>
  <rect width="1800" height="1000" fill="#fff"/>
  <rect width="1800" height="108" fill="#f4f8fb"/>
  <text x="70" y="67" class="title">温度—含水率—物性的顺序耦合机制</text>

  <g filter="url(#shadow)">
    <rect x="65" y="180" width="310" height="250" rx="24" fill="#f8fbfd" stroke="#9fb8ca" stroke-width="3"/>
    <text x="105" y="230" class="h">外部时变边界</text>
    <rect x="105" y="263" width="230" height="65" rx="15" fill="#fff0e7"/>
    <text x="220" y="305" class="math" text-anchor="middle">Ta(t)</text>
    <rect x="105" y="344" width="230" height="65" rx="15" fill="#e8f4fb"/>
    <text x="220" y="386" class="math" text-anchor="middle">Ca(t)</text>

    <rect x="65" y="548" width="310" height="250" rx="24" fill="#f8fbfd" stroke="#9fb8ca" stroke-width="3"/>
    <text x="105" y="598" class="h">表面对流交换</text>
    <text x="105" y="652" class="b">换热系数 h</text>
    <text x="105" y="694" class="b">传质系数 hm</text>
    <text x="105" y="756" class="s">第三类边界条件</text>
  </g>
  <path d="M220 430 V536" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="500" y="190" width="410" height="240" rx="26" fill="#fff4ec" stroke="#e79868" stroke-width="3"/>
    <circle cx="564" cy="254" r="31" fill="#df6e32"/>
    <path d="M564 227 C540 262 548 280 564 285 C584 278 590 258 564 227Z" fill="#fff"/>
    <text x="618" y="263" class="h">温度场 T(r,t)</text>
    <text x="540" y="323" class="b">Fourier 导热</text>
    <text x="540" y="365" class="math">ρ cp ∂T/∂t = ∇·(k∇T)</text>
    <text x="540" y="406" class="s">热量由表面向轴线传播</text>

    <rect x="500" y="560" width="410" height="240" rx="26" fill="#eaf5fb" stroke="#6eadd0" stroke-width="3"/>
    <circle cx="564" cy="624" r="31" fill="#2d86bd"/>
    <path d="M564 596 C542 629 546 649 564 654 C583 649 589 628 564 596Z" fill="#fff"/>
    <text x="618" y="633" class="h">含水率场 C(r,t)</text>
    <text x="540" y="693" class="b">Fick 扩散</text>
    <text x="540" y="735" class="math">∂C/∂t = ∇·(D∇C)</text>
    <text x="540" y="776" class="s">水分由内部向表面迁移</text>
  </g>
  <path d="M375 642 H488" stroke="#49657d" stroke-width="4" marker-end="url(#arr)" fill="none"/>
  <path d="M375 592 C430 592 430 308 488 308" stroke="#49657d" stroke-width="4" marker-end="url(#arr)" fill="none"/>

  <g filter="url(#shadow)">
    <rect x="1045" y="190" width="420" height="240" rx="26" fill="#f5f1fb" stroke="#9e8bce" stroke-width="3"/>
    <text x="1088" y="245" class="h">热物性反馈</text>
    <rect x="1088" y="278" width="334" height="93" rx="17" fill="#fff" stroke="#cfc3e8" stroke-width="2"/>
    <text x="1255" y="318" class="math" text-anchor="middle">C → ρ(C), cp(C), k(C)</text>
    <text x="1255" y="351" class="s" text-anchor="middle">改变温度方程储热与导热能力</text>

    <rect x="1045" y="560" width="420" height="240" rx="26" fill="#eef9f2" stroke="#78bd8f" stroke-width="3"/>
    <text x="1088" y="615" class="h">扩散系数反馈</text>
    <rect x="1088" y="648" width="334" height="93" rx="17" fill="#fff" stroke="#b8dec5" stroke-width="2"/>
    <text x="1255" y="688" class="math" text-anchor="middle">(T,C) → D(T,C)</text>
    <text x="1255" y="721" class="s" text-anchor="middle">改变内部水分迁移速率</text>
  </g>

  <path d="M910 680 H1033" stroke="#2d86bd" stroke-width="5" marker-end="url(#wet)" fill="none"/>
  <path d="M1045 746 C975 866 790 882 690 812" stroke="#2d86bd" stroke-width="5" marker-end="url(#wet)" fill="none"/>
  <path d="M910 642 C982 642 985 355 1033 355" stroke="#49657d" stroke-width="4" marker-end="url(#arr)" fill="none"/>
  <path d="M1045 282 C990 282 990 264 922 264" stroke="#df6e32" stroke-width="5" marker-end="url(#hot)" fill="none"/>
  <path d="M910 322 C980 322 988 612 1033 612" stroke="#df6e32" stroke-width="5" marker-end="url(#hot)" fill="none"/>

  <g filter="url(#shadow)">
    <rect x="1540" y="270" width="205" height="450" rx="25" fill="#18324b"/>
    <text x="1642" y="328" class="h" text-anchor="middle" fill="#fff">每个时间层</text>
    <circle cx="1642" cy="398" r="39" fill="#fff"/><text x="1642" y="407" class="h" text-anchor="middle">1</text>
    <text x="1642" y="458" class="b" text-anchor="middle" fill="#fff">更新热物性</text>
    <path d="M1642 479 V514" stroke="#fff" stroke-width="3" marker-end="url(#white)"/>
    <circle cx="1642" cy="557" r="39" fill="#fff"/><text x="1642" y="566" class="h" text-anchor="middle">2</text>
    <text x="1642" y="617" class="b" text-anchor="middle" fill="#fff">求 T，再更新 D</text>
    <text x="1642" y="665" class="b" text-anchor="middle" fill="#fff">求 C，检查收敛</text>
    <text x="1642" y="701" font-size="26px" text-anchor="middle" fill="#dbe6ee">Picard 迭代</text>
  </g>

  <rect x="65" y="874" width="1680" height="79" rx="20" fill="#f4f8fb" stroke="#cbd9e3" stroke-width="2"/>
  <text x="105" y="923" class="b"><tspan font-weight="700">问题一：</tspan>ρ、cp、k 为常数，D = D(C)</text>
  <text x="745" y="923" class="b"><tspan font-weight="700">问题二至四：</tspan>物性随局部 T、C 动态更新</text>
</svg>
