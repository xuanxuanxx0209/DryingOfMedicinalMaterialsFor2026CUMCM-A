<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="820" viewBox="0 0 1800 820" fill="#18324b">
  <defs>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#49657d"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#18324b" flood-opacity="0.12"/></filter>
    <style>text{font-family:'SimHei','Microsoft YaHei','Noto Sans CJK SC',sans-serif}.title{font-size:50px;font-weight:700}.h{font-size:34px;font-weight:700}.b{font-size:30px}.s{font-size:26px;fill:#617487}.tag{font-size:28px;font-weight:700}</style>
  </defs>
  <rect width="1800" height="820" fill="#fff"/>
  <rect width="1800" height="108" fill="#f4f8fb"/>
  <text x="70" y="67" class="title">计算任务、观测数据与终点的时间尺度</text>
  <rect x="1375" y="25" width="355" height="58" rx="17" fill="#fff4ec" stroke="#e79768" stroke-width="2"/>
  <text x="1552" y="64" class="tag" text-anchor="middle" fill="#c75f2a">关键节点非等比例示意</text>

  <line x1="105" y1="395" x2="1700" y2="395" stroke="#49657d" stroke-width="7" marker-end="url(#arr)"/>
  <g stroke="#49657d" stroke-width="4">
    <line x1="150" y1="365" x2="150" y2="425"/><line x1="405" y1="365" x2="405" y2="425"/><line x1="690" y1="365" x2="690" y2="425"/><line x1="830" y1="365" x2="830" y2="425"/><line x1="1330" y1="365" x2="1330" y2="425"/><line x1="1460" y1="365" x2="1460" y2="425"/><line x1="1655" y1="365" x2="1655" y2="425"/>
  </g>
  <text x="150" y="465" class="b" text-anchor="middle">0</text>
  <text x="405" y="465" class="b" text-anchor="middle">0.5 h</text>
  <text x="690" y="465" class="b" text-anchor="middle">3 h</text>
  <text x="830" y="465" class="b" text-anchor="middle">4 h</text>
  <text x="1330" y="465" class="b" text-anchor="middle">51.0775 h</text>
  <text x="1460" y="465" class="b" text-anchor="middle">57.4322 h</text>
  <text x="1655" y="465" class="b" text-anchor="middle">72 h</text>

  <g filter="url(#shadow)">
    <rect x="125" y="165" width="305" height="135" rx="22" fill="#fff5e8" stroke="#e5ad50" stroke-width="3"/>
    <text x="277" y="213" class="h" text-anchor="middle">问题一</text>
    <text x="277" y="253" class="b" text-anchor="middle">预热平衡 0–1800 s</text>
    <text x="277" y="282" class="s" text-anchor="middle">每 1 s × 每 0.1 cm 输出</text>

    <rect x="450" y="165" width="310" height="135" rx="22" fill="#eaf5fb" stroke="#68add0" stroke-width="3"/>
    <text x="605" y="213" class="h" text-anchor="middle">问题二</text>
    <text x="605" y="253" class="b" text-anchor="middle">全程模型前三小时</text>
    <text x="605" y="282" class="s" text-anchor="middle">表格每 0.5 h 抽样</text>

    <rect x="875" y="165" width="415" height="135" rx="22" fill="#f5f1fb" stroke="#9785ca" stroke-width="3"/>
    <text x="1082" y="213" class="h" text-anchor="middle">问题三</text>
    <text x="1082" y="253" class="b" text-anchor="middle">固定域连续推进至阈值</text>
    <text x="1082" y="282" class="s" text-anchor="middle">终点 57.4322 h</text>

    <rect x="1315" y="165" width="390" height="135" rx="22" fill="#eef9f2" stroke="#6db586" stroke-width="3"/>
    <text x="1510" y="213" class="h" text-anchor="middle">问题四</text>
    <text x="1510" y="253" class="b" text-anchor="middle">收缩域连续推进至阈值</text>
    <text x="1510" y="282" class="s" text-anchor="middle">终点 51.0775 h</text>
  </g>

  <path d="M150 350 H830" stroke="#3d96bd" stroke-width="14" stroke-linecap="round" opacity="0.65"/>
  <text x="490" y="340" class="tag" text-anchor="middle" fill="#2d7fa8">附件 1：烘房温度与空气水分浓度实测区间（0–4 h）</text>
  <path d="M830 350 H1655" stroke="#3d96bd" stroke-width="14" stroke-linecap="round" stroke-dasharray="18 12" opacity="0.4"/>
  <text x="1242" y="340" class="s" text-anchor="middle">问题三、四：以 2.5–4 h 稳定段均值延拓空气边界</text>
  <path d="M150 505 H1655" stroke="#4e9f6b" stroke-width="13" stroke-linecap="round" opacity="0.55"/>
  <text x="902" y="548" class="tag" text-anchor="middle" fill="#41875a">附件 2：半径观测区间 0–72 h；问题四终点位于观测区间内</text>

  <g filter="url(#shadow)">
    <rect x="100" y="610" width="1600" height="145" rx="24" fill="#f8fbfd" stroke="#c0d0dc" stroke-width="2"/>
  </g>
  <text x="145" y="657" class="h">统一的离散与判定节奏</text>
  <text x="145" y="702" class="b">内部时间步逐秒推进并检查全域阈值；论文表格与 result 文件只按题目要求抽样输出。</text>
  <text x="145" y="735" class="s">因此“每 60 s 保存一次”不会把干燥终点的时间分辨率降为 60 s。</text>
</svg>
